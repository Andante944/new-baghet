<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Пластиковый багет — Baghet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-catalog="plastic">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="logo" href="index.html">Baghet<span>.</span></a>
        <nav class="nav" data-nav>
          <a href="index.html">Baghet</a>
          <a class="is-active" href="plastic.html" data-i18n="nav_plastic">Пластиковый багет</a>
          <a href="hardware.html" data-i18n="nav_hardware">Фурнитура</a>
          <a href="contacts.html" data-i18n="nav_contacts">Контакты</a>
        </nav>
        <div class="header-actions">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-btn" data-lang="ru">RU</button>
            <button type="button" class="lang-btn" data-lang="ro">RO</button>
          </div>
          <a class="btn btn--sm btn--outline" href="#" data-i18n="nav_login">Войти</a>
          <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-label="Menu">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </header>

    <main class="catalog-layout">
      <aside>
        <form class="filters" data-filters>
          <h2 data-i18n="section_cats">Каталог</h2>

          <fieldset class="filter-group">
            <legend data-i18n="filter_width">Ширина багета</legend>
            <label><input type="checkbox" name="width" value="1-3" /> <span data-i18n="w_1_3">1–3 см</span></label>
            <label><input type="checkbox" name="width" value="4-5" /> <span data-i18n="w_4_5">4–5 см</span></label>
            <label><input type="checkbox" name="width" value="6-7" /> <span data-i18n="w_6_7">6–7 см</span></label>
            <label><input type="checkbox" name="width" value="8-10" /> <span data-i18n="w_8_10">8–10 см</span></label>
          </fieldset>

          <fieldset class="filter-group">
            <legend data-i18n="filter_color">Цвет</legend>
            <label><input type="checkbox" name="color" value="white" /> <span data-i18n="color_white">Белый</span></label>
            <label><input type="checkbox" name="color" value="gold" /> <span data-i18n="color_gold">Золотой</span></label>
            <label><input type="checkbox" name="color" value="silver" /> <span data-i18n="color_silver">Серебряный</span></label>
            <label><input type="checkbox" name="color" value="brown" /> <span data-i18n="color_brown">Коричневый</span></label>
            <label><input type="checkbox" name="color" value="black" /> <span data-i18n="color_black">Чёрный</span></label>
            <label><input type="checkbox" name="color" value="red" /> <span data-i18n="color_red">Красный</span></label>
            <label><input type="checkbox" name="color" value="blue" /> <span data-i18n="color_blue">Синий</span></label>
          </fieldset>
        </form>
      </aside>

      <section>
        <div class="catalog-toolbar">
          <div>
            <h1 data-i18n="cat_plastic_title">Пластиковый багет</h1>
            <p data-i18n="catalog_plastic_lead">Выберите профиль по ширине и цвету. Цены и остатки — демо для макета.</p>
          </div>
          <p class="results-count"><span data-i18n="results">Найдено</span>: <span data-results-count>0</span></p>
        </div>
        <div class="product-grid" data-product-grid></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <span data-i18n="footer_note">Baghet.md · пластиковый багет и фурнитура</span>
        <a href="contacts.html" data-i18n="nav_contacts">Контакты</a>
      </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
